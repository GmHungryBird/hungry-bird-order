<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hungry Bird B2B — Order</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; background: #f5f4f1; color: #2c2c2a; padding-bottom: 100px; }
  header { background: #1d3b2f; color: #fff; padding: 16px; text-align: center; }
  header h1 { font-size: 18px; font-weight: 600; }
  header p { font-size: 12px; opacity: 0.8; margin-top: 2px; }
  .section { padding: 16px; }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #5f5e5a; }
  select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #d3d1c7; font-size: 15px; background: #fff; }
  .brand-group { margin-bottom: 20px; }
  .brand-title { font-size: 14px; font-weight: 700; color: #0f6e56; margin: 16px 0 8px; text-transform: uppercase; letter-spacing: 0.5px; }
  .product-card { display: flex; justify-content: space-between; align-items: center; background: #fff; border: 1px solid #e5e3dc; border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; }
  .product-name { font-size: 14px; font-weight: 600; }
  .product-price { font-size: 12px; color: #5f5e5a; margin-top: 2px; }
  .qty-control { display: flex; align-items: center; gap: 10px; }
  .qty-btn { width: 30px; height: 30px; border-radius: 50%; border: 1px solid #d3d1c7; background: #fff; font-size: 16px; cursor: pointer; }
  .qty-val { min-width: 20px; text-align: center; font-size: 14px; font-weight: 600; }
  .cart-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid #d3d1c7; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
  .cart-total { font-size: 15px; font-weight: 700; }
  .cart-total span { display: block; font-size: 11px; font-weight: 400; color: #5f5e5a; }
  .submit-btn { background: #1d3b2f; color: #fff; border: none; padding: 12px 24px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .submit-btn:disabled { background: #b4b2a9; cursor: not-allowed; }
  .msg { padding: 12px 16px; border-radius: 8px; font-size: 13px; margin: 0 16px 12px; }
  .msg.success { background: #e1f5ee; color: #085041; }
  .msg.error { background: #fcebeb; color: #791f1f; }
  .loading { text-align: center; padding: 40px; color: #888780; font-size: 13px; }
</style>
</head>
<body>

<header>
  <h1>Hungry Bird B2B</h1>
  <p>Order coffee beans & pastry</p>
</header>

<div id="msgBox"></div>

<div class="section">
  <label for="customerSelect">Pilih toko/usaha kamu</label>
  <select id="customerSelect">
    <option value="">Memuat daftar customer...</option>
  </select>
</div>

<div id="productList" class="section">
  <div class="loading">Memuat produk...</div>
</div>

<div class="cart-bar">
  <div class="cart-total">
    <span>Total</span>
    <span id="cartTotal">Rp 0</span>
  </div>
  <button class="submit-btn" id="submitBtn" disabled onclick="submitOrder()">Kirim order</button>
</div>

<script>
// ============================================================
// GANTI dengan URL Apps Script Web App kamu setelah deploy
// ============================================================
var SCRIPT_URL = 'https://script.google.com/macros/s/GANTI_DENGAN_DEPLOYMENT_ID/exec';

var products = [];
var customers = [];
var cart = {}; // product_id -> qty

function jsonpRequest(action, params, onSuccess) {
  var callbackName = 'cb_' + action + '_' + Date.now();
  window[callbackName] = function (result) {
    delete window[callbackName];
    document.body.removeChild(script);
    if (result.ok) {
      onSuccess(result);
    } else {
      showMsg(result.error || 'Terjadi kesalahan', 'error');
    }
  };

  var query = 'action=' + encodeURIComponent(action) + '&callback=' + callbackName;
  Object.keys(params || {}).forEach(function (key) {
    query += '&' + key + '=' + encodeURIComponent(params[key]);
  });

  var script = document.createElement('script');
  script.src = SCRIPT_URL + '?' + query;
  script.onerror = function () {
    showMsg('Gagal menghubungi server. Cek koneksi internet.', 'error');
  };
  document.body.appendChild(script);
}

function showMsg(text, type) {
  var box = document.getElementById('msgBox');
  box.innerHTML = '<div class="msg ' + type + '">' + text + '</div>';
  if (type === 'success') {
    setTimeout(function () { box.innerHTML = ''; }, 6000);
  }
}

function loadCustomers() {
  jsonpRequest('getCustomers', {}, function (result) {
    customers = result.data;
    var select = document.getElementById('customerSelect');
    select.innerHTML = '<option value="">-- Pilih toko/usaha --</option>' +
      customers.map(function (c) {
        return '<option value="' + c.id + '" data-zone="' + c.zone_id + '">' + c.business_name + '</option>';
      }).join('');
  });
}

function loadProducts() {
  jsonpRequest('getProducts', {}, function (result) {
    products = result.data;
    renderProducts();
  });
}

function renderProducts() {
  var brands = {};
  products.forEach(function (p) {
    if (!brands[p.brand]) brands[p.brand] = [];
    brands[p.brand].push(p);
  });

  var html = '';
  Object.keys(brands).forEach(function (brand) {
    html += '<div class="brand-group">';
    html += '<div class="brand-title">' + brand + '</div>';
    brands[brand].forEach(function (p) {
      html += '<div class="product-card">' +
        '<div>' +
          '<div class="product-name">' + p.name + '</div>' +
          '<div class="product-price">Rp ' + formatNumber(p.price) + ' / ' + p.unit + '</div>' +
        '</div>' +
        '<div class="qty-control">' +
          '<button class="qty-btn" onclick="changeQty(\'' + p.id + '\', -1)">−</button>' +
          '<span class="qty-val" id="qty-' + p.id + '">0</span>' +
          '<button class="qty-btn" onclick="changeQty(\'' + p.id + '\', 1)">+</button>' +
        '</div>' +
      '</div>';
    });
    html += '</div>';
  });

  document.getElementById('productList').innerHTML = html || '<div class="loading">Belum ada produk aktif.</div>';
}

function changeQty(productId, delta) {
  var current = cart[productId] || 0;
  var next = Math.max(0, current + delta);
  cart[productId] = next;
  document.getElementById('qty-' + productId).textContent = next;
  updateCartSummary();
}

function updateCartSummary() {
  var total = 0;
  var hasItems = false;
  Object.keys(cart).forEach(function (productId) {
    var qty = cart[productId];
    if (qty > 0) {
      hasItems = true;
      var product = products.find(function (p) { return p.id === productId; });
      if (product) total += product.price * qty;
    }
  });
  document.getElementById('cartTotal').textContent = 'Rp ' + formatNumber(total);
  document.getElementById('submitBtn').disabled = !hasItems || !document.getElementById('customerSelect').value;
}

function formatNumber(n) {
  return Number(n).toLocaleString('id-ID');
}

function submitOrder() {
  var customerId = document.getElementById('customerSelect').value;
  if (!customerId) {
    showMsg('Pilih toko/usaha dulu', 'error');
    return;
  }

  var items = Object.keys(cart)
    .filter(function (id) { return cart[id] > 0; })
    .map(function (id) { return { product_id: id, qty: cart[id] }; });

  if (!items.length) {
    showMsg('Pilih minimal 1 produk', 'error');
    return;
  }

  var selectedOption = document.getElementById('customerSelect').selectedOptions[0];
  var zoneId = selectedOption.getAttribute('data-zone');

  document.getElementById('submitBtn').disabled = true;
  document.getElementById('submitBtn').textContent = 'Mengirim...';

  jsonpRequest('submitOrder', {
    customer_id: customerId,
    zone_id: zoneId,
    items: JSON.stringify(items)
  }, function (result) {
    showMsg('Order berhasil dikirim! Nomor order: ' + result.order_id, 'success');
    cart = {};
    renderProducts();
    document.getElementById('submitBtn').textContent = 'Kirim order';
    updateCartSummary();
  });
}

document.getElementById('customerSelect').addEventListener('change', updateCartSummary);

loadCustomers();
loadProducts();
</script>

</body>
</html>
